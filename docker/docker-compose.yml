services:
  frontend:
    container_name: nox-sword-frontend-rag
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: development
    volumes:
      - ../app/frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  backend:
    container_name: nox-sword-backend-rag
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: development
    volumes:
      - ../app/backend:/app/backend
    ports:
      - "8000:8000"
    working_dir: /app/backend
    command: sh -c "pip install -r dependencies/requirements.txt --break-system-packages && uvicorn app:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      frontend:
        condition: service_started
    tty: true
    stdin_open: true
    restart: unless-stopped

volumes:
  frontend_node_modules: